<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <!-- Stylised satellite view used as the map widget's placeholder until the live map loads.
       Shows what the visitor will do: find their roof and outline it. -->
  <rect width="600" height="400" fill="#4b5547"/>
  <!-- grass / lots -->
  <rect x="0" y="0" width="600" height="400" fill="#556150" opacity="0.6"/>
  <circle cx="70" cy="330" r="38" fill="#3f4a3c"/>
  <circle cx="110" cy="355" r="30" fill="#3a4537"/>
  <circle cx="545" cy="60" r="34" fill="#3f4a3c"/>
  <circle cx="515" cy="95" r="22" fill="#3a4537"/>
  <!-- streets -->
  <rect x="0" y="168" width="600" height="26" fill="#6e7276"/>
  <rect x="236" y="0" width="24" height="400" fill="#6e7276"/>
  <rect x="0" y="179" width="600" height="3" fill="#8d9195" opacity="0.6"/>
  <rect x="246" y="0" width="3" height="400" fill="#8d9195" opacity="0.6"/>
  <!-- parking lots -->
  <rect x="290" y="212" width="120" height="70" fill="#5f6366"/>
  <g fill="#7b7f83">
    <rect x="296" y="218" width="2" height="26"/><rect x="310" y="218" width="2" height="26"/>
    <rect x="324" y="218" width="2" height="26"/><rect x="338" y="218" width="2" height="26"/>
    <rect x="352" y="218" width="2" height="26"/><rect x="366" y="218" width="2" height="26"/>
    <rect x="380" y="218" width="2" height="26"/><rect x="394" y="218" width="2" height="26"/>
  </g>
  <!-- surrounding rooftops -->
  <rect x="24" y="22" width="180" height="120" fill="#a3a7a6"/>
  <rect x="34" y="32" width="18" height="12" fill="#878b8a"/><rect x="150" y="100" width="22" height="16" fill="#878b8a"/>
  <rect x="24" y="214" width="96" height="80" fill="#b4b7b5"/>
  <rect x="134" y="214" width="78" height="58" fill="#999d9c"/>
  <rect x="440" y="214" width="140" height="150" fill="#a9acab"/>
  <rect x="456" y="236" width="20" height="14" fill="#8a8e8d"/><rect x="540" y="330" width="22" height="16" fill="#8a8e8d"/>
  <rect x="290" y="300" width="120" height="80" fill="#9fa3a2"/>
  <rect x="140" y="300" width="72" height="80" fill="#b0b3b1"/>
  <!-- the target roof, outlined the way the visitor will draw it -->
  <rect x="286" y="24" width="210" height="122" fill="#c5c8c6"/>
  <rect x="300" y="40" width="22" height="16" fill="#a8abaa"/>
  <rect x="440" y="104" width="26" height="18" fill="#a8abaa"/>
  <rect x="380" y="60" width="14" height="10" fill="#a8abaa"/>
  <polygon points="286,24 496,24 496,146 286,146" fill="#0088df" fill-opacity="0.28"
           stroke="#0088df" stroke-width="4" stroke-dasharray="12 8" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#0088df" stroke-width="3">
    <circle cx="286" cy="24" r="6"/><circle cx="496" cy="24" r="6"/>
    <circle cx="496" cy="146" r="6"/><circle cx="286" cy="146" r="6"/>
  </g>
  <!-- pin on the target roof -->
  <g transform="translate(391 60)">
    <path d="M0 34 C-14 18 -18 10 -18 0 a18 18 0 0 1 36 0 c0 10 -4 18 -18 34z" fill="#e53e3e" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6.5" fill="#ffffff"/>
  </g>
</svg>
