# Netlify Configuration for Silicone Roof Pros

[build]
  # Directory to publish (root since it's a static site)
  publish = "."

  # Build command to inject environment variables
  command = "bash build.sh"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    # File names are not content-hashed, so a long "immutable" cache kept
    # returning visitors on stale copies for up to a year after each deploy.
    # Revalidate instead: a cheap 304 when nothing changed. HTML pages also
    # add a ?v= query to these URLs, bumped whenever the files change.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    # File names are not content-hashed, so a long "immutable" cache kept
    # returning visitors on stale copies for up to a year after each deploy.
    # Revalidate instead: a cheap 304 when nothing changed. HTML pages also
    # add a ?v= query to these URLs, bumped whenever the files change.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Images rarely change, but replacing one under the same name must
    # still reach visitors - cap the cache at one day rather than a year.
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Form handling
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true
